name: dbt build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dbt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r ../requirements.txt
      - run: dbt build --profiles-dir .
      - name: Simulate restatement (rewrite September, totals must not double)
        working-directory: .
        run: bash scripts/simulate_restatement.sh

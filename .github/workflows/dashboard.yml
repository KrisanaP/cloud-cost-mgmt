name: dashboard

# build dbt -> test -> Evidence + dbt docs -> (main เท่านั้น) ฝากบน GitHub Pages
# เว็บ:  https://krisanap.github.io/cloud-cost-mgmt/          แดชบอร์ด Evidence
#        https://krisanap.github.io/cloud-cost-mgmt/dbt-docs/  dbt docs + lineage graph
# ต้องเปิด Settings > Pages > Source = GitHub Actions ก่อน (repo private ต้องใช้ GitHub แบบเสียเงิน)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: pip install -r requirements.txt
      - name: dbt build
        working-directory: dbt
        run: dbt build --profiles-dir .
      - name: Streamlit tests
        run: pytest -q tests
      - name: dbt docs (single static file)
        working-directory: dbt
        run: dbt docs generate --profiles-dir . --static
      - name: Export marts for Evidence
        run: python scripts/export_marts.py
      - name: Evidence build
        working-directory: dashboard
        run: |
          npm ci
          npm run sources
          npm run build
      - name: Assemble site
        run: |
          mkdir -p site
          cp -r dashboard/build/cloud-cost-mgmt/. site/ 2>/dev/null || cp -r dashboard/build/. site/
          mkdir -p site/dbt-docs
          cp dbt/target/static_index.html site/dbt-docs/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

version: 2

models:
  - name: fct_cost_line_item
    description: >
      ตารางหลัก 1 แถว = 1 line item มี unblended, net, effective และ cost_class.
      incremental แบบ delete+insert ตาม billing_period เพื่อรองรับ restatement.
      ใช้ effective_cost เป็นฐานของการคิดต้นทุนให้โปรเจกต์ (ดู docs/decisions/0001-effective-cost.md)
    columns:
      - name: line_item_id
        data_tests: [unique, not_null]
      - name: billing_period
        data_tests: [not_null]
      - name: effective_cost
        data_tests: [not_null]
      - name: cost_class
        description: direct / commitment_offset / commitment_unused / tax / support / credit / fee
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [direct, commitment_offset, commitment_unused, tax, support, credit, fee]

  - name: fct_cost_daily
    description: สรุปรายวัน × account × service × resource × cost_class สำหรับรายงาน
    columns:
      - name: usage_date
        data_tests: [not_null]
      - name: resource_key
        data_tests: [not_null]

  - name: fct_cost_attributed
    description: >
      1 แถว = 1 line item พร้อมเจ้าของโปรเจกต์ (Phase 2). table เต็มทุกครั้ง เพราะแก้ ownership ย้อนหลังต้องคิดใหม่ทุกเดือน
    columns:
      - name: line_item_id
        data_tests: [unique, not_null]
      - name: project_id
        data_tests:
          - not_null
          - relationships:
              arguments: {to: ref('projects'), field: project_id}

  - name: fct_project_cost_monthly
    description: billing period × project × cost_class × attribution_source

  - name: fct_cost_allocated
    description: >
      1 แถว = line item × project หลังหาร shared cost (Phase 3) มี allocated_cost, rule_id, rule_version,
      share_pct, is_shared, original_project_id ตารางหลักของหน้าตรวจย้อนกลับ
    columns:
      - name: project_id
        data_tests:
          - not_null
          - relationships:
              arguments: {to: ref('projects'), field: project_id}
      - name: allocation_status
        data_tests:
          - accepted_values:
              arguments:
                values: [direct, allocated, no_basis]
    data_tests:
      - dbt_utils_free_unique_combination:
          arguments:
            columns: [line_item_id, project_id]

  - name: fct_project_cost_allocated_monthly
    description: billing period × project × cost_source (direct หรือ rule_id ที่ส่งเงินมา)

version: 2

sources:
  - name: cur
    description: ไฟล์ AWS CUR 2.0 (ตอนนี้เป็นข้อมูลจำลองใน data/)
    tables:
      - name: cur2_raw
        description: >
          CUR 2.0 จำลอง ก.ค.–ก.ย. 2026, รายวัน, UTC, USD.
          ตำแหน่งไฟล์ตั้งได้ด้วย var `cur_path` (ค่าเริ่มต้น ../data/cur2_sample.parquet)
          เพื่อจำลอง restatement ได้โดยชี้ไปไฟล์เดือนที่ AWS เขียนทับ
        meta:
          external_location: "read_parquet('{{ var(\"cur_path\", \"../data/cur2_sample.parquet\") }}')"
        columns:
          - name: identity_line_item_id
            data_tests:
              - not_null
          - name: line_item_usage_start_date
            data_tests:
              - not_null

  - name: focus
    description: >
      FOCUS 1.0 Sample Data ของ FinOps Foundation (CC BY 4.0) ข้อมูลจริงที่ปิดชื่อแล้ว ก.ย. 2024
      AWS/Azure/OCI/GCP รายชั่วโมง เป็นข้อมูลชุดที่สอง แยกจาก CUR จำลอง ดู data/focus/README.md
    tables:
      - name: focus_raw
        description: >
          100,000 แถวแรกของ sample (ทุกคอลัมน์เป็นข้อความ ให้ staging cast เอง)
          ตำแหน่งไฟล์ตั้งได้ด้วย var `focus_path`
        meta:
          external_location: "read_parquet('{{ var(\"focus_path\", \"../data/focus/focus_sample_100k.parquet\") }}')"
        columns:
          - name: Id
            data_tests: [unique, not_null]
